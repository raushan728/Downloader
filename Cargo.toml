[package]
name = "dwdr"
version = "0.1.0"
edition = "2024"

[lib]
name = "dwdr"
path = "src/lib.rs"

[[bin]]
name = "dwdr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.25"
ctrlc = "3.4"
directories = "6.0.0"
inquire = "0.7.0"
reqwest = { version = "0.12.4", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
rfd = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.8"
unicode-width = "0.1.14"
url = "2.5.8"
fs2 = "0.4.3"
libc = "0.2"
sha2 = "0.10"
zip = "0.6.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "3.2.0"
tempfile = "3.27.0"
