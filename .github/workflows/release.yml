name: Build and Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify Toolchain Version
        run: rustc --version && cargo --version

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test

      - name: Run Real Integration Tests
        run: cargo test --test real_integration -- --ignored

      - name: Run Script Integration Tests (Linux x86_64 Containers)
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/test_install_scripts.sh

      - name: Run Script Integration Tests (Linux ARM64 Native)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bash tests/test_install_scripts.sh --native

      - name: Run Script Integration Tests (macOS Native)
        if: matrix.os == 'macos-latest'
        run: bash tests/test_install_scripts.sh --native

      - name: Run Script Integration Tests (Windows PowerShell)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\tests\test_install_scripts.ps1

      - name: Build release binary
        if: matrix.os != 'macos-latest'
        run: cargo build --release

      - name: Stage binary (Linux x86_64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp target/release/dwdr dist/dwdr-linux

      - name: Stage binary (Linux ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          mkdir -p dist
          cp target/release/dwdr dist/dwdr-linux-arm64

      - name: Build and stage binaries (macOS Universal and ARM64)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/dwdr dist/dwdr-mac-arm64
          lipo -create -output dist/dwdr-mac target/x86_64-apple-darwin/release/dwdr target/aarch64-apple-darwin/release/dwdr

      - name: Stage binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\dwdr.exe dist\dwdr-windows.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums & Extract Version
        run: |
          cd artifacts
          sha256sum dwdr-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "DWDR_VERSION=${VERSION}" >> $GITHUB_ENV
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}"; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Release Versioned Tag
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.DWDR_VERSION }}"
          name: "DWDR v${{ env.DWDR_VERSION }}"
          files: |
            artifacts/dwdr-linux
            artifacts/dwdr-linux-arm64
            artifacts/dwdr-mac
            artifacts/dwdr-mac-arm64
            artifacts/dwdr-windows.exe
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false

      - name: Release Latest Rolling Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "DWDR Latest"
          files: |
            artifacts/dwdr-linux
            artifacts/dwdr-linux-arm64
            artifacts/dwdr-mac
            artifacts/dwdr-mac-arm64
            artifacts/dwdr-windows.exe
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
