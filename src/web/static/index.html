<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWDR Web Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="relative bg-gray-800 rounded-xl p-8 shadow-2xl border border-gray-700 w-full max-w-4xl">
        <button id="openSettingsBtn" title="Settings" class="absolute top-6 right-6 text-gray-400 hover:text-cyan-400 transition duration-200 p-2 rounded-lg hover:bg-gray-700/50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </button>
        <h1 class="text-3xl font-bold text-center text-cyan-400 mb-6">DWDR Web Engine</h1>
        <div class="space-y-4">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-gray-400 mb-1">Media URL</label>
                <input type="text" id="urlInput" placeholder="https://youtube.com/..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white placeholder-gray-500 transition duration-200">
            </div>
            <button id="fetchBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-lg shadow-cyan-900/50">
                Fetch Formats
            </button>
        </div>
        <div id="results" class="hidden mt-6 p-4 bg-gray-900 rounded-lg border border-gray-700 text-sm font-mono overflow-auto max-h-[60vh]">
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-lg shadow-2xl backdrop-blur-sm">
            <h2 class="text-xl font-bold text-cyan-400 mb-4">Engine Settings</h2>
            <div class="space-y-4">
                <div>
                    <label for="configPath" class="block text-sm font-medium text-gray-400 mb-1">Download Path</label>
                    <input type="text" id="configPath" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div>
                    <label for="configQuality" class="block text-sm font-medium text-gray-400 mb-1">Default Quality</label>
                    <input type="text" id="configQuality" placeholder="1080p, 720p, 480p" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button id="cancelConfigBtn" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold transition duration-200">
                    Cancel
                </button>
                <button id="saveConfigBtn" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-semibold transition duration-200 shadow-lg shadow-cyan-900/50">
                    Save
                </button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
